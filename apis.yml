aid: moviepass
name: Moviepass
description: >-
  MoviePass is a consumer movie-theater subscription service that lets members
  see films in theaters nationwide for a low monthly fee. The relaunched service
  (led by co-founder Stacy Spikes after reacquiring the brand) uses a
  credit-based system: members choose a monthly plan, earn credits, and redeem
  them for showtimes at over 4,000 participating US theaters, including major
  chains and independent cinemas, with plans starting around $10/month and no
  long-term commitment. Members browse showtimes and book through the MoviePass
  iOS and Android apps. MoviePass was surfaced in the API Evangelist network as a
  portfolio company of Canaan Partners; it is a direct-to-consumer app business
  and does not publish a traditional public developer API. Its marketing site is
  Wix-powered and exposes a hosted Wix Site MCP server plus an llms.txt for
  agentic access to public site content.
